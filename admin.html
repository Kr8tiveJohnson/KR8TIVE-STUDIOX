<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KR8TIVE STUDIOX | Upload Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:#f8f8f8;
    color:#111;
    min-height:100vh;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:50px 25px;
}

/* Header */

.header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:70px;
}

.logo{
    font-size:.85rem;
    letter-spacing:3px;
    font-weight:700;
    color:#666;
    text-transform:uppercase;
}

.header h1{
    font-size:4.5rem;
    font-weight:800;
    letter-spacing:-3px;
    line-height:.95;
    margin-top:10px;
}

.header p{
    max-width:260px;
    color:#777;
    line-height:1.7;
    font-size:.95rem;
}

/* Upload Card */

.upload-card{
    background:white;
    border-radius:28px;
    padding:50px;
    box-shadow:
    0 10px 40px rgba(0,0,0,.04);

    border:1px solid #eee;
}

.upload-card h2{
    font-size:2rem;
    margin-bottom:10px;
}

.upload-card .subtitle{
    color:#777;
    margin-bottom:35px;
}

/* Drop Zone */

.drop-zone{
    border:2px dashed #d4d4d8;
    border-radius:20px;

    padding:60px 30px;

    text-align:center;

    cursor:pointer;

    transition:.3s;

    background:#fafafa;
}

.drop-zone:hover{
    border-color:#111;
    background:#fff;
}

.drop-zone svg{
    width:50px;
    height:50px;
    margin-bottom:20px;
    opacity:.7;
}

.drop-zone h3{
    font-size:1.2rem;
    margin-bottom:8px;
}

.drop-zone p{
    color:#777;
}

input[type="file"]{
    display:none;
}

/* File List */

.file-list{
    margin-top:25px;
}

.file-item{
    background:#fafafa;
    border:1px solid #eee;
    border-radius:14px;
    padding:14px 18px;
    margin-bottom:10px;
    font-size:.95rem;
}

/* Upload Button */

.upload-btn{
    margin-top:30px;

    width:100%;

    border:none;

    padding:18px;

    border-radius:16px;

    background:#111;
    color:white;

    font-size:1rem;
    font-weight:600;

    cursor:pointer;

    transition:.3s;
}

.upload-btn:hover{
    background:#000;
    transform:translateY(-2px);
}

/* Status */

.status{
    margin-top:20px;
    padding:15px;
    border-radius:14px;
    display:none;
}

.success{
    background:#ecfdf5;
    color:#065f46;
}

.error{
    background:#fef2f2;
    color:#991b1b;
}

/* Responsive */

@media(max-width:768px){

.header{
    flex-direction:column;
    gap:25px;
}

.header h1{
    font-size:3rem;
}

.upload-card{
    padding:30px;
}

}

/* Management Section Styles */
.manage-card {
    margin-top: 40px;
    background: white;
    padding: 50px;
    border-radius: 28px;
    box-shadow: 0 10px 40px rgba(0,0,0,.04);
    border: 1px solid #eee;
}
.manage-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 15px;
    margin-top: 20px;
}
.asset-item {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    background: #f0f0f0;
}
.asset-item img { width: 100%; height: 100px; object-fit: cover; }
.delete-btn {
    position: absolute; top: 5px; right: 5px;
    background: #ff4444; color: white; border: none;
    padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.7rem;
}

</style>
</head>
<body>

<div class="container">

    <div class="header">
        <div>
            <div class="logo">KR8TIVE STUDIOX</div>
            <h1>Upload Portal</h1>
        </div>
        <p>
            Securely upload event photos and media files
            to the gallery management system.
        </p>
    </div>

    <div class="upload-card">
        <h2>Upload Event Photos</h2>
        <p class="subtitle">
            Enter the client code and select your photos to begin.
        </p>

        <form id="uploadForm" enctype="multipart/form-data">

            <!-- Added Client Name Input -->
            <div class="form-group" style="margin-bottom: 20px;">
                <label for="clientName" style="display: block; margin-bottom: 8px; font-weight: bold;">Client Name / Project Code</label>
                <input type="text" id="clientName" name="clientName" placeholder="e.g. joshua-wedding-2026" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box;">
            </div>

            <label class="drop-zone" for="fileInput">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                </svg>
                <h3>Select Photos</h3>
                <p>JPG, PNG, WEBP • Multiple files supported</p>
            </label>

            <input
                type="file"
                id="fileInput"
                name="photos"
                multiple
                required
                style="display: none;" 
            >

            <div id="fileList" class="file-list"></div>

            <button type="submit" class="upload-btn">
                Upload Photos
            </button>

            <div id="status" class="status"></div>

        </form>
    </div>
</div>

<div class="manage-card">
    <h2>Manage Assets</h2>
    <div id="manageGrid" class="manage-grid"></div>
</div>
<script>
const fileInput = document.getElementById('fileInput');
const fileList = document.getElementById('fileList');
const statusBox = document.getElementById('status');
const clientInput = document.getElementById('clientName'); // Added reference

// Display files in UI
fileInput.addEventListener('change', () => {
    fileList.innerHTML = '';
    [...fileInput.files].forEach(file => {
        const item = document.createElement('div');
        item.className = 'file-item';
        item.textContent = file.name;
        fileList.appendChild(item);
    });
});

// Submit Form
document.getElementById('uploadForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const formData = new FormData();
    // Ensure this ID matches the input in your HTML
    const clientName = document.getElementById('clientName').value; 
    formData.append('clientName', clientName);

    [...fileInput.files].forEach(file => {
        formData.append('photos', file);
    });

    try {
        const response = await fetch('/api/upload', {
            method: 'POST',
            body: formData 
        });

        if (response.ok) {
            // Success logic
            loadAssets();
        } else {
            // Handle error
            const result = await response.json();
            console.error("Server Error:", result);
        }
    } catch(error) {
        console.error("Fetch Error:", error);
    }
});
// Fetch files based on client name
async function loadAssets() {
    const clientName = document.getElementById('clientName').value || 'uncategorized';
    // Matches the new GET route: /api/photos/:clientName
    const res = await fetch(`/api/photos/${encodeURIComponent(clientName)}`);
    const files = await res.json();
    
    const grid = document.getElementById('manageGrid');
    grid.innerHTML = '';
    
    files.forEach(file => {
        grid.innerHTML += `
            <div class="asset-item">
                <img src="/uploads/${encodeURIComponent(clientName)}/${encodeURIComponent(file)}">
                <button onclick="deleteFile('${file}')">Delete</button>
            </div>
        `;
    });
}

// Delete file based on client name
async function deleteFile(filename) {
    const clientName = document.getElementById('clientName').value;
    // Matches the new DELETE route: /api/photos/:clientName/:filename
    const res = await fetch(`/api/photos/${encodeURIComponent(clientName)}/${encodeURIComponent(filename)}`, { 
        method: 'DELETE' 
    });
    if (res.ok) loadAssets();
}
</script>

</body>
</html>
